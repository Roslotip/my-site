<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roslo — Healthy Recipes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --surface2: #f2ede4;
    --text: #1a1612;
    --text2: #5c5449;
    --text3: #9c9088;
    --accent: #2d7a4f;
    --accent2: #e8a83e;
    --accent3: #d45f3c;
    --border: #e8e0d4;
    --shadow: rgba(45,35,20,0.10);
    --card-radius: 20px;
    --tag-radius: 30px;
    --transition: 0.28s cubic-bezier(0.4,0,0.2,1);
  }
  [data-theme="dark"] {
    --bg: #14110e;
    --surface: #1f1b16;
    --surface2: #2a2318;
    --text: #f0ebe3;
    --text2: #b8ad9e;
    --text3: #7a7060;
    --accent: #4aad72;
    --accent2: #f0bb55;
    --accent3: #e07050;
    --border: #332d22;
    --shadow: rgba(0,0,0,0.35);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    padding: 0 clamp(16px, 4vw, 48px);
    box-shadow: 0 2px 20px var(--shadow);
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; align-items: center; gap: 24px;
    height: 72px;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem; font-weight: 900;
    color: var(--accent);
    white-space: nowrap;
    letter-spacing: -0.5px;
    text-decoration: none;
  }
  .logo span { color: var(--accent2); }
  .search-wrap {
    flex: 1; max-width: 500px; position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 44px 10px 18px;
    border: 1.5px solid var(--border);
    border-radius: var(--tag-radius);
    background: var(--surface2);
    color: var(--text);
    font-family: inherit; font-size: 0.95rem;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(45,122,79,0.12);
  }
  .search-wrap svg {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text3); pointer-events: none;
  }
  .header-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .dark-toggle {
    width: 44px; height: 26px; border-radius: 13px;
    background: var(--border); border: none; cursor: pointer;
    position: relative; transition: background var(--transition);
    flex-shrink: 0;
  }
  .dark-toggle::after {
    content: '';
    position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent);
    transition: transform var(--transition);
  }
  [data-theme="dark"] .dark-toggle { background: var(--accent); }
  [data-theme="dark"] .dark-toggle::after { transform: translateX(18px); background: #fff; }
  .toggle-label { font-size: 0.82rem; color: var(--text3); white-space: nowrap; }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, var(--accent) 0%, #1a5c38 60%, #0f3d22 100%);
    color: #fff;
    padding: clamp(40px, 8vw, 80px) clamp(16px, 4vw, 48px);
    text-align: center;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900; line-height: 1.15;
    margin-bottom: 14px;
  }
  .hero p { font-size: clamp(1rem, 2vw, 1.2rem); opacity: 0.85; max-width: 560px; margin: 0 auto; }

  /* FILTERS */
  .filters-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(16px, 4vw, 48px);
    position: sticky; top: 72px; z-index: 90;
  }
  .filters-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; gap: 10px; padding: 12px 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .filters-inner::-webkit-scrollbar { display: none; }
  .filter-btn {
    padding: 8px 20px;
    border-radius: var(--tag-radius);
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-family: inherit; font-size: 0.88rem; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: all var(--transition);
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active {
    background: var(--accent); border-color: var(--accent);
    color: #fff; box-shadow: 0 4px 14px rgba(45,122,79,0.3);
  }

  /* MAIN */
  main {
    max-width: 1400px; margin: 0 auto;
    padding: 36px clamp(16px, 4vw, 48px) 60px;
  }
  .results-info {
    font-size: 0.9rem; color: var(--text3); margin-bottom: 24px;
  }
  .results-info span { color: var(--accent); font-weight: 600; }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 28px;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border-radius: var(--card-radius);
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 4px 20px var(--shadow);
    transition: transform var(--transition), box-shadow var(--transition);
    display: flex; flex-direction: column;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px var(--shadow);
  }
  .card-img-wrap {
    position: relative; overflow: hidden;
    aspect-ratio: 4/3;
  }
  .card-img-wrap img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 0.5s ease;
  }
  .card:hover .card-img-wrap img { transform: scale(1.07); }
  .card-cat {
    position: absolute; top: 12px; left: 12px;
    background: var(--accent2);
    color: #fff;
    padding: 4px 12px; border-radius: var(--tag-radius);
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.3px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .card-cal {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 4px 10px; border-radius: var(--tag-radius);
    font-size: 0.75rem; font-weight: 600;
    backdrop-filter: blur(4px);
  }
  .card-body { padding: 18px 20px 20px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.13rem; font-weight: 700;
    line-height: 1.3;
    color: var(--text);
  }
  .card-meta {
    display: flex; gap: 14px;
    font-size: 0.82rem; color: var(--text3);
  }
  .card-meta span { display: flex; align-items: center; gap: 4px; }
  .macros {
    display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap;
  }
  .macro-tag {
    padding: 3px 10px; border-radius: var(--tag-radius);
    font-size: 0.75rem; font-weight: 600;
  }
  .macro-p { background: rgba(45,122,79,0.12); color: var(--accent); }
  .macro-f { background: rgba(232,168,62,0.12); color: var(--accent2); }
  .macro-c { background: rgba(212,95,60,0.12); color: var(--accent3); }
  .card-btn {
    margin-top: auto; padding-top: 14px;
    display: flex;
  }
  .btn-view {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 20px; border-radius: var(--tag-radius);
    background: var(--accent); color: #fff;
    border: none; font-family: inherit; font-size: 0.88rem; font-weight: 600;
    cursor: pointer;
    transition: background var(--transition), transform var(--transition);
  }
  .btn-view:hover { background: #245f3e; transform: scale(1.03); }

  /* NO RESULTS */
  .no-results {
    text-align: center; padding: 80px 20px;
    color: var(--text3); grid-column: 1/-1;
  }
  .no-results svg { margin-bottom: 16px; opacity: 0.3; }
  .no-results h3 { font-size: 1.3rem; font-family: 'Playfair Display', serif; margin-bottom: 8px; color: var(--text2); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(10,8,4,0.7);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity var(--transition);
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border-radius: var(--card-radius);
    max-width: 760px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    transform: scale(0.94) translateY(20px);
    transition: transform var(--transition);
    position: relative;
  }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }
  .modal-close {
    position: absolute; top: 16px; right: 16px; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface2); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); transition: background var(--transition);
  }
  .modal-close:hover { background: var(--border); }
  .modal-img { width: 100%; aspect-ratio: 16/7; object-fit: cover; border-radius: var(--card-radius) var(--card-radius) 0 0; }
  .modal-body { padding: 28px 32px 36px; }
  .modal-cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .modal-cat {
    display: inline-block; padding: 4px 14px; border-radius: var(--tag-radius);
    background: var(--accent2); color: #fff;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.5px;
  }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 900; line-height: 1.2;
    margin-bottom: 14px;
  }
  .modal-stats {
    display: flex; flex-wrap: wrap; gap: 12px;
    margin-bottom: 22px;
  }
  .stat-box {
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 18px;
    background: var(--surface2);
    border-radius: 14px; border: 1px solid var(--border);
    min-width: 90px;
  }
  .stat-val { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
  .stat-lbl { font-size: 0.72rem; color: var(--text3); margin-top: 2px; }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem; font-weight: 700;
    margin-bottom: 12px; margin-top: 22px;
    color: var(--text);
    border-left: 3px solid var(--accent);
    padding-left: 12px;
  }
  .ingredients-list {
    list-style: none;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px 16px;
  }
  .ingredients-list li {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.9rem; color: var(--text2);
    padding: 4px 0;
  }
  .ingredients-list li::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent2); flex-shrink: 0;
  }
  .steps-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .step {
    display: flex; gap: 14px;
    font-size: 0.9rem; color: var(--text2); line-height: 1.6;
  }
  .step-num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 0.78rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 24px; border-top: 1px solid var(--border);
    color: var(--text3); font-size: 0.85rem;
  }

  /* SCROLLBAR */
  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-track { background: var(--surface2); }
  .modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 640px) {
    .header-inner { gap: 12px; }
    .logo { font-size: 1.25rem; }
    .toggle-label { display: none; }
    .ingredients-list { grid-template-columns: 1fr; }
    .modal-body { padding: 20px 18px 28px; }
    .modal-stats { gap: 8px; }
    .stat-box { min-width: 70px; padding: 10px 12px; }
  }
</style>
</head>

    img:"https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=800&q=80",
    ingredients:["3 medium zucchinis spiralized (400g)","60g fresh basil","30g pine nuts","2 garlic cloves","40g Parmesan grated","4 tbsp extra-virgin olive oil","Salt & black pepper","100g cherry tomatoes halved","Lemon zest to serve"],
    steps:["Spiralize zucchini into noodles using a spiralizer or vegetable peeler.","Sprinkle lightly with salt and let sit 10 min, then pat dry to remove excess moisture.","Blend basil, pine nuts, garlic, Parmesan, and olive oil in a food processor until smooth.","Season pesto with salt and pepper.","Toss zucchini noodles with the pesto until evenly coated.","Add cherry tomatoes and gently fold through.","Plate up, top with extra Parmesan, lemon zest, and serve immediately."]
  },
  {
    id:11, name:"Almond Energy Balls", cat:"Snacks", cal:160, time:"15 min", protein:"5g", fat:"9g", carbs:"16g",
    img:"https://images.unsplash.com/photo-1558961363-fa8fdf82db35?w=800&q=80",
    ingredients:["150g Medjool dates pitted","100g rolled oats","60g almond butter","30g cocoa powder (unsweetened)","20g dark chocolate chips","1 tsp vanilla extract","Pinch sea salt","Desiccated coconut for rolling"],

  },
  {
    id:12, name:"Lemon Herb Chicken Bowl", cat:"Dinner", cal:510, time:"40 min", protein:"45g", fat:"14g", carbs:"44g",
    img:"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=800&q=80",

  },
  {
    id:13, name:"Mango Turmeric Smoothie", cat:"Smoothies", cal:260, time:"5 min", protein:"6g", fat:"4g", carbs:"52g",
    img:"https://images.unsplash.com/photo-1534353436294-0dbd4bdac845?w=800&q=80",

  },
  {
    id:14, name:"Oat Banana Pancakes", cat:"Breakfast", cal:370, time:"20 min", protein:"15g", fat:"8g", carbs:"58g",
    img:"https://images.unsplash.com/photo-1565299543923-37dd37887442?w=800&q=80",
    ingredients:["2 ripe bananas (200g)","2 large eggs","80g rolled oats blended to flour","1 tsp baking powder","½ tsp cinnamon","1 tsp vanilla extract","Pinch salt","100g fresh blueberries","1 tbsp coconut oil for cooking"],

  },
  {
    id:15, name:"Edamame Hummus", cat:"Snacks", cal:190, time:"10 min", protein:"11g", fat:"8g", carbs:"18g",
    img:"https://images.unsplash.com/photo-1541014741259-de529411b96a?w=800&q=80",
    ingredients:["200g shelled edamame (cooked)","2 tbsp tahini","2 garlic cloves","2 tbsp lemon juice","2 tbsp olive oil","Salt & pepper","Pinch cumin","2 tbsp water","Cucumber sticks to serve","Smoked paprika to garnish"],
    steps:["Add edamame, tahini, garlic, lemon juice, and olive oil to a food processor.","Process for 2 minutes until fairly smooth.","Add water to achieve your desired consistency. Blend again.","Season generously with salt, pepper, and cumin.","Taste and adjust lemon or salt as needed.","Transfer to a bowl, drizzle with olive oil and sprinkle smoked paprika.","Serve with cucumber sticks, carrot sticks, or whole-grain crackers."]
  },
  {
    id:16, name:"Sweet Potato Black Bean Tacos", cat:"Dinner", cal:460, time:"35 min", protein:"16g", fat:"10g", carbs:"72g",
    img:"https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=800&q=80",
    ingredients:["300g sweet potato cubed","200g canned black beans drained","8 small corn tortillas","½ red onion diced","100g corn kernels","1 avocado mashed","Juice of 1 lime","1 tsp cumin","1 tsp smoked paprika","Fresh coriander to serve"],
    steps:["Preheat oven to 200°C. Toss sweet potato with cumin, smoked paprika, oil, salt.","Roast for 25 minutes until caramelized and tender.","Warm black beans in a pan with a little cumin and salt.","Heat tortillas in a dry pan for 30 seconds each side.","Mash avocado with lime juice and a pinch of salt.","Assemble tacos: spread avocado, add sweet potato, black beans, corn, and onion.","Finish with fresh coriander and a squeeze of extra lime."]
  },
  {
    id:17, name:"Egg White Veggie Frittata", cat:"Breakfast", cal:220, time:"25 min", protein:"24g", fat:"8g", carbs:"10g",
    img:"https://images.unsplash.com/photo-1614621659-90f4af0f21ac?w=800&q=80",
    ingredients:["6 large egg whites","2 whole eggs","80g cherry tomatoes halved","50g baby spinach","50g mushrooms sliced","40g goat cheese crumbled","1 tbsp olive oil","2 garlic cloves","Salt, pepper, dried oregano"],
    steps:["Preheat oven to 180°C. Whisk egg whites and whole eggs together with salt and pepper.","Heat olive oil in an oven-safe skillet over medium heat.","Sauté garlic 1 minute, then add mushrooms and cook until soft.","Add spinach and stir until wilted, about 2 minutes.","Pour egg mixture over the vegetables and swirl gently.","Scatter cherry tomatoes and goat cheese on top.","Transfer to oven and bake 15 minutes until set. Slice and serve."]
  },
  {
    id:18, name:"Grilled Shrimp Tacos", cat:"Dinner", cal:420, time:"25 min", protein:"35g", fat:"14g", carbs:"38g",
    img:"https://images.unsplash.com/photo-1565299507177-b0ac66763828?w=800&q=80",
    ingredients:["300g large shrimp peeled","8 small flour tortillas","1 cup purple cabbage shredded","1 avocado sliced","Juice of 2 limes","1 tsp chili powder","1 tsp garlic powder","1 tbsp olive oil","2 tbsp plain yogurt","Fresh coriander leaves"],
    steps:["Toss shrimp with olive oil, chili powder, garlic powder, salt, and lime juice.","Marinate for 10 minutes. Heat grill or pan to high heat.","Grill shrimp 2 minutes per side until pink and cooked through.","Mix yogurt with a pinch of salt and drizzle of lime — this is the crema.","Warm tortillas on the dry grill for 30 seconds.","Build tacos: cabbage, shrimp, avocado slices, yogurt crema.","Finish with fresh coriander and extra lime."]
  },
  {
    id:19, name:"Walnut Date Bars", cat:"Snacks", cal:210, time:"20 min", protein:"5g", fat:"11g", carbs:"27g",
    img:"https://images.unsplash.com/photo-1571748982800-fa51082c2224?w=800&q=80",
    ingredients:["200g Medjool dates pitted","100g walnuts","60g rolled oats","2 tbsp honey","1 tsp cinnamon","½ tsp vanilla","Pinch salt","30g dark chocolate drizzled on top"],
    steps:["Line a small baking dish with parchment paper.","Process walnuts and oats in a food processor to rough crumbs.","Add dates, honey, cinnamon, vanilla, and salt.","Process until mixture clumps together when pressed.","Press firmly and evenly into the prepared dish.","Melt dark chocolate and drizzle over the top.","Refrigerate 1 hour, then slice into 10 bars. Store up to 1 week."]
  },
  {
    id:20, name:"Thai Basil Tofu Stir-Fry", cat:"Dinner", cal:360, time:"22 min", protein:"22g", fat:"15g", carbs:"32g",
    img:"https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=800&q=80",
    ingredients:["300g firm tofu pressed & cubed","2 cups cooked jasmine rice","100g green beans","1 red bell pepper sliced","3 garlic cloves minced","2 tbsp low-sodium soy sauce","1 tbsp oyster sauce (vegan optional)","1 tbsp sesame oil","Large handful Thai basil","1 red chili sliced"],
    steps:["Press tofu for at least 15 minutes to remove excess moisture, then cube.","Heat sesame oil in wok over high heat until smoking.","Fry tofu until golden on all sides, about 5 minutes. Remove and set aside.","Stir-fry garlic and chili 30 seconds, then add green beans and bell pepper.","Cook vegetables 3–4 minutes until tender-crisp.","Return tofu to wok. Add soy sauce and oyster sauce. Toss everything together.","Remove from heat, stir in Thai basil, and serve immediately over rice."]
  },
  {
    id:21, name:"Green Detox Smoothie", cat:"Smoothies", cal:220, time:"5 min", protein:"5g", fat:"4g", carbs:"44g",
    img:"https://images.unsplash.com/photo-1540420773420-3366772f4999?w=800&q=80",
    ingredients:["2 cups fresh kale leaves","1 green apple cored","½ cucumber","1 celery stalk","1 lemon juiced","1 inch fresh ginger","250ml cold water","5 ice cubes","1 tbsp honey optional"],
    steps:["Wash all produce thoroughly under cold water.","Roughly chop the green apple, cucumber, and celery.","Add cold water and ice to the blender first.","Add kale, apple, cucumber, celery, ginger, and lemon juice.","Blend on high for 90 seconds until completely smooth.","Taste — add honey if you prefer a touch of sweetness.","Pour through a fine-mesh strainer for a smoother texture, or drink as-is."]
  },
  {
    id:22, name:"Mediterranean Lentil Soup", cat:"Dinner", cal:380, time:"45 min", protein:"20g", fat:"7g", carbs:"58g",
    img:"https://images.unsplash.com/photo-1547592166-23ac45744acd?w=800&q=80",
    ingredients:["250g red lentils rinsed","1 large onion diced","3 garlic cloves minced","2 carrots diced","400g canned chopped tomatoes","1.2L vegetable stock","2 tsp cumin","1 tsp coriander","1 tsp smoked paprika","2 tbsp olive oil","Lemon juice & parsley to serve"],
    steps:["Heat olive oil in a large pot over medium heat.","Sauté onion and carrots for 8 minutes until softened.","Add garlic, cumin, coriander, and paprika. Cook 2 minutes, stirring.","Add lentils, chopped tomatoes, and vegetable stock. Bring to a boil.","Reduce heat and simmer 25 minutes until lentils break down.","Use an immersion blender to partially blend for a creamy-chunky texture.","Season well, squeeze lemon juice, and serve topped with fresh parsley."]
  },
  {
    id:23, name:"Caprese Stuffed Avocado", cat:"Lunch", cal:380, time:"10 min", protein:"12g", fat:"28g", carbs:"16g",
    img:"https://images.unsplash.com/photo-1571934811356-5cc061b6821f?w=800&q=80",
    ingredients:["2 ripe avocados halved","150g fresh mozzarella balls","150g cherry tomatoes halved","Large handful fresh basil","2 tbsp balsamic glaze","1 tbsp extra-virgin olive oil","Sea salt & cracked black pepper","1 tsp lemon juice"],
    steps:["Halve the avocados and remove the pits. Enlarge the cavity slightly with a spoon.","Drizzle lemon juice over avocados to prevent browning.","In a bowl, combine mozzarella and cherry tomatoes with olive oil and a pinch of salt.","Fill each avocado half generously with the mozzarella-tomato mixture.","Tuck fresh basil leaves throughout.","Drizzle balsamic glaze artfully over the top.","Finish with cracked black pepper and serve immediately."]
  },
  {
    id:24, name:"Spiced Pumpkin Oatmeal", cat:"Breakfast", cal:340, time:"12 min", protein:"11g", fat:"7g", carbs:"58g",
    img:"https://images.unsplash.com/photo-1484723091739-30a097e8f929?w=800&q=80",
    ingredients:["100g rolled oats","300ml oat milk","100g pumpkin purée","1 tsp pumpkin pie spice","1 tsp cinnamon","1 tbsp maple syrup","1 tsp vanilla extract","20g pecans chopped","30g dried cranberries"],
    steps:["Combine oats and oat milk in a saucepan over medium heat.","Bring to a gentle simmer, stirring frequently.","After 3 minutes, stir in pumpkin purée, pumpkin pie spice, cinnamon, and vanilla.","Cook another 4–5 minutes until oats reach desired consistency.","Remove from heat and stir in maple syrup.","Serve in a bowl topped with chopped pecans and dried cranberries.","Drizzle extra maple syrup if desired and enjoy warm."]
  },
  {
    id:25, name:"Tuna Niçoise Salad", cat:"Lunch", cal:490, time:"20 min", protein:"38g", fat:"18g", carbs:"36g",
    img:"https://images.unsplash.com/photo-1595295333158-4742f28fbd85?w=800&q=80",
    ingredients:["2 cans tuna in water (drained, 280g)","200g green beans blanched","3 eggs hard-boiled","200g baby potatoes halved","80g Kalamata olives","100g cherry tomatoes","3 tbsp olive oil","1 tbsp red wine vinegar","1 tsp Dijon mustard","Capers & fresh parsley"],
    steps:["Boil baby potatoes 12 minutes until tender. Drain and cool.","Blanch green beans in boiling water for 3 minutes. Shock in cold water.","Hard-boil eggs for 10 minutes. Peel and halve.","Whisk olive oil, red wine vinegar, mustard, salt, and pepper for the dressing.","Arrange potatoes, green beans, tuna, eggs, tomatoes, and olives on a platter.","Drizzle the dressing over all components.","Scatter capers and fresh parsley. Serve at room temperature."]
  },
  {
    id:26, name:"Pineapple Ginger Smoothie", cat:"Smoothies", cal:245, time:"5 min", protein:"4g", fat:"3g", carbs:"52g",
    img:"https://images.unsplash.com/photo-1526318896980-cf78c088247c?w=800&q=80",
    ingredients:["200g frozen pineapple chunks","1 banana","250ml coconut water","1 inch fresh ginger peeled","1 tbsp lime juice","100g plain yogurt","1 tsp honey","4 ice cubes"],
    steps:["Peel and roughly chop the fresh ginger.","Add coconut water and ice cubes to the blender.","Add frozen pineapple, banana, yogurt, and ginger.","Pour in lime juice and honey.","Blend on high for 60–90 seconds until completely smooth and frothy.","Taste and adjust sweetness or ginger to preference.","Pour into a tall glass and serve immediately."]
  },
  {
    id:27, name:"Chicken & Veggie Meal Prep Bowls", cat:"Lunch", cal:530, time:"45 min", protein:"48g", fat:"12g", carbs:"52g",
    img:"https://images.unsplash.com/photo-1547592180-85f173990554?w=800&q=80",
    ingredients:["400g chicken breast","180g cooked brown rice","150g broccoli florets","100g snap peas","2 carrots sliced","3 tbsp low-sodium teriyaki sauce","1 tbsp sesame oil","2 garlic cloves","1 tsp grated ginger","Sesame seeds & green onions"],
    steps:["Slice chicken breast into thin strips. Marinate in 2 tbsp teriyaki sauce for 20 min.","Cook brown rice per package instructions.","Blanch broccoli and snap peas in boiling water for 3 minutes. Drain.","Heat sesame oil in a large pan. Add garlic and ginger, stir 1 minute.","Add chicken and cook through, about 6–7 minutes. Add remaining teriyaki sauce.","Stir in blanched vegetables and carrots. Toss to coat.","Divide rice into meal-prep containers. Top with chicken-veggie mix. Garnish and store."]

  {
    id:28, name:"Ricotta Berry Toast", cat:"Breakfast", cal:295, time:"8 min", protein:"16g", fat:"8g", carbs:"38g",
    img:"https://images.unsplash.com/photo-1484723091739-30a097e8f929?w=800&q=80",
    ingredients:["2 slices rye bread","120g part-skim ricotta","80g fresh strawberries sliced","60g blueberries","1 tbsp honey","1 tsp lemon zest","Fresh mint leaves","Pinch cinnamon"],

  },
  {
    id:29, name:"Black Bean Soup", cat:"Dinner", cal:340, time:"40 min", protein:"18g", fat:"5g", carbs:"54g",
    img:"https://images.unsplash.com/photo-1547592166-23ac45744acd?w=800&q=80",
    ingredients:["2 cans black beans drained (480g)","1 onion diced","4 garlic cloves","2 celery stalks diced","1 red bell pepper","1 tsp cumin","1 tsp coriander","½ tsp cayenne","800ml vegetable broth","Juice of 1 lime","Plain yogurt & coriander to serve"],
    steps:["Sauté onion and celery in olive oil for 7 minutes over medium heat.","Add garlic, cumin, coriander, and cayenne. Cook 2 minutes until fragrant.","Add diced red bell pepper and cook 3 minutes more.","Add black beans and vegetable broth. Bring to a boil.","Simmer for 20 minutes. Use a potato masher to roughly mash some of the beans.","Add lime juice and season with salt to taste.","Serve with a dollop of yogurt and fresh coriander leaves."]
  },
  {
    id:30, name:"Cottage Cheese Power Bowl", cat:"Breakfast", cal:310, time:"5 min", protein:"28g", fat:"5g", carbs:"34g",
    img:"https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800&q=80",
    ingredients:["200g low-fat cottage cheese","80g pineapple chunks","50g kiwi sliced","30g granola","1 tbsp honey","1 tbsp flaxseeds","5 fresh mint leaves","Pinch of cinnamon"],
    steps:["Spoon cottage cheese into a bowl as the base.","Arrange pineapple chunks and kiwi slices artfully on top.","Sprinkle granola over one side for texture contrast.","Drizzle honey over the fruit.","Scatter flaxseeds evenly for a nutritional boost.","Dust lightly with cinnamon.","Garnish with fresh mint and serve immediately."]
  },
  {
    id:31, name:"Asian Sesame Noodle Salad", cat:"Lunch", cal:410, time:"20 min", protein:"14g", fat:"14g", carbs:"58g",
    img:"https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=800&q=80",
    ingredients:["200g soba noodles","2 tbsp sesame oil","2 tbsp low-sodium soy sauce","1 tbsp rice vinegar","1 tbsp honey","1 tsp grated ginger","100g shredded red cabbage","1 carrot julienned","3 spring onions sliced","2 tbsp sesame seeds","Fresh coriander"],
    steps:["Cook soba noodles per package (usually 5 minutes). Drain and rinse with cold water.","Whisk sesame oil, soy sauce, rice vinegar, honey, and ginger for the dressing.","Toss cold noodles with three-quarters of the dressing.","Add shredded cabbage, julienned carrot, and spring onions.","Toss everything together until well combined.","Drizzle remaining dressing over the top.","Sprinkle sesame seeds and fresh coriander. Serve at room temperature."]
  },
  {
    id:32, name:"Roasted Veggie & Feta Wrap", cat:"Lunch", cal:430, time:"35 min", protein:"16g", fat:"14g", carbs:"56g",
    img:"https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=800&q=80",
    ingredients:["2 whole-wheat tortillas (large)","1 red bell pepper sliced","1 zucchini sliced","100g eggplant cubed","60g feta cheese crumbled","40g baby spinach","2 tbsp hummus","1 tbsp olive oil","1 tsp dried Italian herbs","Lemon juice to drizzle"],
    steps:["Preheat oven to 200°C. Toss bell pepper, zucchini, and eggplant with olive oil and herbs.","Roast vegetables for 22 minutes until tender and slightly charred at edges.","Spread 1 tbsp hummus down the center of each tortilla.","Layer spinach leaves on top of the hummus.","Add a generous portion of roasted vegetables.","Crumble feta over the vegetables. Drizzle with lemon juice.","Fold in the sides and roll tightly. Slice diagonally and serve."]
  },
  {
    id:33, name:"Kale Caesar Salad", cat:"Lunch", cal:370, time:"15 min", protein:"14g", fat:"22g", carbs:"26g",
    img:"https://images.unsplash.com/photo-1605926637512-c8b131444a4b?w=800&q=80",
    ingredients:["200g curly kale torn","40g Parmesan shaved","50g whole-wheat croutons","2 tbsp Greek yogurt","1 tbsp lemon juice","1 tsp Dijon mustard","1 garlic clove minced","2 tbsp olive oil","1 tsp Worcestershire sauce","Black pepper"],
    steps:["Wash and thoroughly dry the kale. Remove tough stems and tear into pieces.","Massage kale leaves with a pinch of salt for 2 minutes to soften them.","Whisk together yogurt, lemon juice, mustard, garlic, olive oil, and Worcestershire sauce.","Season the dressing with black pepper.","Toss kale in the dressing until every leaf is coated.","Add croutons and half the Parmesan. Toss gently.","Transfer to a serving plate, top with remaining Parmesan shavings."]
  },
  {
    id:34, name:"Poached Salmon with Dill", cat:"Dinner", cal:390, time:"25 min", protein:"40g", fat:"18g", carbs:"12g",
    img:"https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=800&q=80",
    ingredients:["2 salmon fillets (160g each)","500ml vegetable stock","1 lemon sliced","4 dill sprigs","1 bay leaf","5 black peppercorns","150g steamed baby potatoes","100g green beans","3 tbsp Greek yogurt","1 tsp capers"],
    steps:["Bring vegetable stock, lemon slices, bay leaf, dill sprigs, and peppercorns to a simmer.","Gently slide salmon fillets into the simmering liquid — do not boil.","Poach for 10–12 minutes until salmon is opaque and flakes easily.","Meanwhile, steam baby potatoes and green beans until just tender.","Mix Greek yogurt with capers and a squeeze of lemon for the sauce.","Remove salmon gently with a slotted spoon.","Plate with potatoes and green beans. Spoon yogurt-caper sauce over salmon."]
  },
  {
    id:35, name:"Peanut Butter Apple Slices", cat:"Snacks", cal:255, time:"3 min", protein:"8g", fat:"14g", carbs:"28g",
    img:"https://images.unsplash.com/photo-1568702846914-96b305d2aaeb?w=800&q=80",
    ingredients:["2 medium apples","3 tbsp natural peanut butter","1 tsp honey","Pinch cinnamon","10g dark chocolate chips","1 tbsp granola","Pinch sea salt"],
    steps:["Core the apples and slice each into 8 wedges.","Arrange apple slices in a fan pattern on a plate.","Warm peanut butter slightly in the microwave (15 seconds) for easier spreading.","Mix peanut butter with honey and a pinch of cinnamon.","Spoon a small dollop of peanut butter onto each apple slice.","Sprinkle dark chocolate chips and granola over the peanut butter.","Finish with a pinch of sea salt for the perfect sweet-salty contrast."]
  },
  {
    id:36, name:"Roasted Cauliflower Steaks", cat:"Dinner", cal:280, time:"35 min", protein:"8g", fat:"14g", carbs:"30g",
    img:"https://images.unsplash.com/photo-1607305387299-a3d9611cd469?w=800&q=80",
    ingredients:["1 large cauliflower","3 tbsp olive oil","2 garlic cloves minced","1 tsp smoked paprika","1 tsp cumin","Pinch chili flakes","30g pine nuts toasted","Fresh parsley","2 tbsp tahini","Lemon to serve"],
    steps:["Preheat oven to 210°C. Slice cauliflower into 4 thick steaks from the center.","Mix olive oil, garlic, smoked paprika, cumin, and chili flakes.","Brush both sides of each steak generously with the spiced oil.","Arrange on a baking sheet and roast 15 minutes. Flip carefully and roast 15 more minutes.","While steaks roast, toast pine nuts in a dry pan until golden.","Mix tahini with lemon juice and 1 tbsp water to make a drizzle sauce.","Plate the steaks, drizzle tahini, scatter pine nuts and fresh parsley."]
  },
  {
    id:37, name:"Acai Smoothie Bowl", cat:"Smoothies", cal:380, time:"8 min", protein:"8g", fat:"12g", carbs:"62g",
    img:"https://images.unsplash.com/photo-1590301157890-4810ed352733?w=800&q=80",
    ingredients:["200g frozen acai puree","1 frozen banana","100ml pomegranate juice","50g mixed berries","30g granola","1 tbsp goji berries","1 tbsp coconut flakes","1 kiwi sliced","1 tbsp honey to drizzle"],
    steps:["Remove frozen acai puree from packaging and break into chunks.","Blend acai, frozen banana, and pomegranate juice together.","Blend until thick and smooth — it should be the consistency of soft-serve ice cream.","Pour into a chilled bowl.","Arrange granola, mixed berries, goji berries, and kiwi slices on top.","Sprinkle coconut flakes for extra crunch.","Drizzle honey and serve immediately before the bowl melts."]
  },
  {
    id:38, name:"Baked Cod with Salsa Verde", cat:"Dinner", cal:310, time:"28 min", protein:"38g", fat:"12g", carbs:"6g",
    img:"https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=800&q=80",
    ingredients:["2 cod fillets (200g each)","Large bunch flat-leaf parsley","2 tbsp capers","1 garlic clove","1 anchovy fillet","3 tbsp olive oil","1 tbsp lemon juice","1 tsp Dijon mustard","Salt & pepper","150g cherry tomatoes"],
    steps:["Preheat oven to 195°C. Season cod fillets on both sides.","Blend parsley, capers, garlic, anchovy, olive oil, lemon juice, and mustard in a processor.","Process until a chunky green sauce forms. Season to taste.","Place cod on a baking sheet lined with parchment.","Scatter cherry tomatoes around the fish.","Spoon salsa verde generously over the cod fillets.","Bake 15–18 minutes until cod flakes. Serve with extra salsa verde."]
  },
  {
    id:39, name:"Spiced Roasted Chickpeas", cat:"Snacks", cal:180, time:"35 min", protein:"9g", fat:"5g", carbs:"26g",
    img:"https://images.unsplash.com/photo-1585136917228-ec7d13e685da?w=800&q=80",
    ingredients:["400g canned chickpeas drained","1½ tbsp olive oil","1 tsp smoked paprika","1 tsp cumin","½ tsp garlic powder","½ tsp onion powder","Pinch cayenne","½ tsp sea salt","½ tsp black pepper","1 tsp dried rosemary"],
    steps:["Preheat oven to 200°C. Drain and rinse chickpeas thoroughly.","Pat chickpeas completely dry with paper towels — this is key for crunchiness.","Spread on a baking sheet in a single layer. Roast 15 minutes to dry out.","Remove from oven. Toss with olive oil and all spices.","Return to oven and roast another 15–20 minutes until golden and crunchy.","Check every 5 minutes towards the end to prevent burning.","Let cool completely on the baking sheet — they crisp up more as they cool."]
  },
  {
    id:40, name:"Stuffed Bell Peppers", cat:"Dinner", cal:440, time:"50 min", protein:"28g", fat:"10g", carbs:"54g",
    img:"https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=800&q=80",
    ingredients:["4 large bell peppers (mixed colors)","200g lean ground beef","150g cooked brown rice","400g canned diced tomatoes","1 onion diced","3 garlic cloves","1 tsp cumin","1 tsp oregano","40g mozzarella grated","Fresh basil to serve"],
    steps:["Preheat oven to 190°C. Cut tops off peppers and remove seeds.","Sauté onion 5 minutes, add garlic and ground beef. Cook until browned.","Drain excess fat. Stir in diced tomatoes, cumin, oregano, and salt.","Simmer 10 minutes until sauce thickens. Stir in cooked rice.","Stand peppers in a baking dish. Spoon filling into each one generously.","Top with grated mozzarella and replace the pepper tops.","Bake 30 minutes until peppers are tender. Garnish with fresh basil."]

// DARK MODE
const html = document.documentElement;
const toggle = document.getElementById('darkToggle');
const label = document.getElementById('themeLabel');
toggle.addEventListener('click', () => {
  const isDark = html.dataset.theme === 'dark';
  html.dataset.theme = isDark ? 'light' : 'dark';
  label.textContent = isDark ? 'Light' : 'Dark';
});

// RENDER
let activeCat = 'All';
let searchTerm = '';

function render() {
  const grid = document.getElementById('recipeGrid');
  const resCount = document.getElementById('resCount');
  const filtered = recipes.filter(r => {
    const catOk = activeCat === 'All' || r.cat === activeCat;
    const searchOk = r.name.toLowerCase().includes(searchTerm) ||
                     r.cat.toLowerCase().includes(searchTerm) ||
                     r.ingredients.some(i => i.toLowerCase().includes(searchTerm));
    return catOk && searchOk;
  });

  resCount.textContent = filtered.length;
  if (!filtered.length) {
    grid.innerHTML = `<div class="no-results"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><h3>No recipes found</h3><p>Try a different search or filter</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(r => `
    <div class="card" onclick="openModal(${r.id})">
      <div class="card-img-wrap">
        <img src="${r.img}" alt="${r.name}" loading="lazy">
        <span class="card-cat">${r.cat}</span>
        <span class="card-cal">🔥 ${r.cal} kcal</span>
      </div>
      <div class="card-body">
        <div class="card-name">${r.name}</div>
        <div class="card-meta">
          <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>${r.time}</span>
          <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>1 serving</span>
        </div>
        <div class="macros">
          <span class="macro-tag macro-p">P: ${r.protein}</span>
          <span class="macro-tag macro-f">F: ${r.fat}</span>
          <span class="macro-tag macro-c">C: ${r.carbs}</span>
        </div>
        <div class="card-btn">
          <button class="btn-view">View Recipe <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    </div>
  `).join('');
}

// FILTERS
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  render();
});

// SEARCH
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

// MODAL
const overlay = document.getElementById('modalOverlay');
const modal = document.getElementById('modal');

function openModal(id) {
  const r = recipes.find(x => x.id === id);
  if (!r) return;
  document.getElementById('modalImg').src = r.img;
  document.getElementById('modalImg').alt = r.name;
  document.getElementById('modalCat').textContent = r.cat;
  document.getElementById('modalTitle').textContent = r.name;
  document.getElementById('modalStats').innerHTML = `
    <div class="stat-box"><div class="stat-val">${r.cal}</div><div class="stat-lbl">Calories</div></div>
    <div class="stat-box"><div class="stat-val">${r.time}</div><div class="stat-lbl">Prep Time</div></div>
    <div class="stat-box"><div class="stat-val">${r.protein}</div><div class="stat-lbl">Protein</div></div>
    <div class="stat-box"><div class="stat-val">${r.fat}</div><div class="stat-lbl">Fat</div></div>
    <div class="stat-box"><div class="stat-val">${r.carbs}</div><div class="stat-lbl">Carbs</div></div>
  `;
  document.getElementById('modalIngredients').innerHTML = r.ingredients.map(i => `<li>${i}</li>`).join('');
  document.getElementById('modalSteps').innerHTML = r.steps.map((s, i) => `<li class="step"><span class="step-num">${i+1}</span><span>${s}</span></li>`).join('');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  modal.scrollTop = 0;
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

render();
</script>
